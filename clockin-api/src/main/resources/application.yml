spring:
  application:
    name: clockin-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clockin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    # Use uma chave forte em produção (>= 32 bytes em base64).
    # Gere com: openssl rand -base64 48
    secret: ${JWT_SECRET:Y2hhdmUtZGV2LXRyb2Nhci1lbS1wcm9kdWNhby1jaGF2ZS1kZXYtdHJvY2FyLWVtLXByb2R1Y2Fv}
    # Em milissegundos (8 horas)
    expiration-ms: 28800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO
    io.clockin: DEBUG
